---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateDcimDevice
  parameters:
    expand_range: true
  data:
    - template_name: "arista-7050cx3-32c-super-spine-switch"
      device_type: ["Arista", "Arista 7050CX3-32C"]
      role: "spine"
      interfaces:
        kind: TemplateInterfaceVirtual
        data:
          - template_name: "Arista7050CX3SpineLoopback0"
            name: "Loopback0"
            role: "loopback"
    - template_name: "arista-7050cx3-32c-super-spine-switch"
      device_type: ["Arista", "Arista 7050CX3-32C"]
      role: "spine"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "Arista7050CX3SpineEthernet[1-32]/1"
            name: "Ethernet[1-32]/1"
            profiles: ["profile-interface-spine"]

    - template_name: "arista-7050cx3-32c-spine-switch"
      device_type: ["Arista", "Arista 7050CX3-32C"]
      role: "spine"
      interfaces:
        kind: TemplateInterfaceVirtual
        data:
          - template_name: "Arista7050CX3SpineLoopback0"
            name: "Loopback0"
            role: "loopback"
    - template_name: "arista-7050cx3-32c-spine-switch"
      device_type: ["Arista", "Arista 7050CX3-32C"]
      role: "spine"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "Arista7050CX3SpineEthernet[1-28]/1"
            name: "Ethernet[1-28]/1"
            profiles: ["profile-interface-leaf"]
          - template_name: "Arista7050CX3SpineEthernet[29-32]/1"
            name: "Ethernet[29-32]/1"
            profiles: ["profile-interface-super-spine"]
    - template_name: "arista-7050sx3-48yc8c-leaf-switch"
      device_type: ["Arista", "Arista 7050SX3-48YC8C"]
      role: "leaf"
      interfaces:
        kind: TemplateInterfaceVirtual
        data:
          - template_name: "Arista7050SX3LeafLoopback0"
            name: "Loopback0"
            role: "loopback"
    - template_name: "arista-7050sx3-48yc8c-leaf-switch"
      device_type: ["Arista", "Arista 7050SX3-48YC8C"]
      role: "leaf"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "Arista7050SX3LeafEthernet[1-48]"
            name: "Ethernet[1-48]"
            profiles: ["profile-interface-server"]
          - template_name: "Arista7050SX3LeafEthernet[49-54]/1"
            name: "Ethernet[49-54]/1"
            profiles: ["profile-interface-spine"]
          - template_name: "Arista7050SX3LeafEthernet[55-56]/1"
            name: "Ethernet[55-56]/1"
            profiles: ["profile-interface-mlag-peer"]
    - template_name: arista-7050cx3-32c-multipod-spine-switch
      device_type:
        - Arista
        - Arista 7050CX3-32C
      role: spine
      interfaces:
        kind: TemplateInterfaceVirtual
        data:
          - template_name: Arista7050CX3MultiPodSpineLoopback0
            name: Loopback0
            role: loopback
    - template_name: arista-7050cx3-32c-multipod-spine-switch
      device_type:
        - Arista
        - Arista 7050CX3-32C
      role: spine
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: Arista7050CX3MultiPodSpineEthernet[1-26]/1
            name: Ethernet[1-26]/1
            profiles:
              - profile-interface-leaf
          - template_name: Arista7050CX3MultiPodSpineEthernet[27-32]/1
            name: Ethernet[27-32]/1
            profiles:
              - profile-interface-super-spine
    - template_name: arista-7050sx3-48yc8c-l2leaf-switch
      device_type:
        - Arista
        - Arista 7050SX3-48YC8C
      role: l2leaf
      interfaces:
        kind: TemplateInterfaceVirtual
        data:
          - template_name: Arista7050SX3L2LeafLoopback0
            name: Loopback0
            role: loopback
    - template_name: arista-7050sx3-48yc8c-l2leaf-switch
      device_type:
        - Arista
        - Arista 7050SX3-48YC8C
      role: l2leaf
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: Arista7050SX3L2LeafEthernet[1-48]
            name: Ethernet[1-48]
            profiles:
              - profile-interface-server
          - template_name: Arista7050SX3L2LeafEthernet[49-50]/1
            name: Ethernet[49-50]/1
            profiles:
              - profile-interface-l3leaf-uplink
          - template_name: Arista7050SX3L2LeafEthernet[51-56]/1
            name: Ethernet[51-56]/1

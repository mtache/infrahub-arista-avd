---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkFabric
  data:
    - name: "Fabric-L3LS"
      index: 64
      # Single-DC 3-stage L3LS: no super-spines (no super_spine device design).
      fabric_interface_sorting_method: "create_sorted_device_interface_map"
      virtual_router_mac: "00:1c:73:00:00:64"
      mgmt_gateway: "10.64.0.1"
      asn_pool: "Fabric-L3LS-ASN-Pool"
      node_id_pool: "Fabric-L3LS-NodeID-Pool"
      mgmt_pool: "Fabric-L3LS-Mgmt-Pool"
      fabric_ip_pools:
        - "Fabric-L3LS-Mgmt-Pool"
        - "Fabric-L3LS-Uplink-Pool"
        - "Fabric-L3LS-VTEP-Pool"
        - "Fabric-L3LS-Loopback-Pool"
      underlay_routing_protocol: "ebgp"
      overlay_routing_protocol: "ebgp"
      p2p_uplinks_mtu: 1500
      uplink_pool: "Fabric-L3LS-Uplink-Pool"
      vtep_pool: "Fabric-L3LS-VTEP-Pool"
      loopback_pool: "Fabric-L3LS-Loopback-Pool"
      spanning_tree_mode: "mstp"
      spanning_tree_priority: 4096
      dns_servers:
        - dns-google
      ntp_servers:
        - time.google.com
      local_users:
        - admin
      member_of_groups: ["fabrics"]
      children:
        kind: NetworkPod
        data:
          - name: "sdc-l3ls-pod1"
            index: 1
            device_designs:
              data:
                - role: spine
                  device_quantity: 2
                  device_template: arista-7050cx3-32c-spine-switch
            mlag_peer_pool: "Fabric-L3LS-MLAG-Peer-Pool"
            mlag_l3_pool: "Fabric-L3LS-MLAG-L3-Pool"
            pod_ip_pools:
              - "Fabric-L3LS-MLAG-Peer-Pool"
              - "Fabric-L3LS-MLAG-L3-Pool"
            member_of_groups: ["pods"]

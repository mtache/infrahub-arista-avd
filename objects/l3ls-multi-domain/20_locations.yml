---
# ============================================================================
# Halls and racks for the Fabric-L3LS-Multi-Domain dual-DC lab.
# Rack names match the AVD group names; generated device names remain
# generator-derived from pod name, rack index, and leaf index.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationHall
  data:
    - name: "Hall-DC1"
      index: 1
    - name: "Hall-DC2"
      index: 2
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationRack
  data:
    - name: "DC1_BORDER"
      index: 1
      rack_type: compute
      pod: infrahub-dc1
      parent: "Hall-DC1"
      mlag: false
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: arista-7050sx3-48yc8c-leaf-switch
      member_of_groups: ["racks"]
    - name: "DC1_ACCESS"
      index: 2
      rack_type: compute
      pod: infrahub-dc1
      parent: "Hall-DC1"
      mlag: false
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: arista-7050sx3-48yc8c-leaf-switch
      member_of_groups: ["racks"]
    - name: "DC2_BORDER"
      index: 1
      rack_type: compute
      pod: infrahub-dc2
      parent: "Hall-DC2"
      mlag: false
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: arista-7050sx3-48yc8c-leaf-switch
      member_of_groups: ["racks"]
    - name: "DC2_ACCESS"
      index: 2
      rack_type: compute
      pod: infrahub-dc2
      parent: "Hall-DC2"
      mlag: false
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: arista-7050sx3-48yc8c-leaf-switch
      member_of_groups: ["racks"]

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AvdTag
  data:
    - name: DC1
      description: "Fabric-L3LS-Multi-Domain DC1-local AVD services"
      racks:
        - DC1_ACCESS
        - DC1_BORDER
    - name: DC2
      description: "Fabric-L3LS-Multi-Domain DC2-local AVD services"
      racks:
        - DC2_ACCESS
        - DC2_BORDER

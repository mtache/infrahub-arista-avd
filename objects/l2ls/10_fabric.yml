---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkFabric
  data:
    - name: "Fabric-L2LS"
      index: 60
      # Standalone L2LS: no super-spines (no super_spine device design).
      fabric_interface_sorting_method: "create_reverse_sorted_device_interface_map"
      mgmt_gateway: "10.60.0.1"
      asn_pool: "Fabric-L2LS-ASN-Pool"
      node_id_pool: "Fabric-L2LS-NodeID-Pool"
      mgmt_pool: "Fabric-L2LS-Mgmt-Pool"
      fabric_ip_pools:
        - "Fabric-L2LS-Mgmt-Pool"
        - "Fabric-L2LS-Uplink-Pool"
        - "Fabric-L2LS-VTEP-Pool"
        - "Fabric-L2LS-Loopback-Pool"
      virtual_router_mac: "00:1c:73:00:00:66"
      underlay_routing_protocol: "none"
      p2p_uplinks_mtu: 9214
      uplink_pool: "Fabric-L2LS-Uplink-Pool"
      vtep_pool: "Fabric-L2LS-VTEP-Pool"
      loopback_pool: "Fabric-L2LS-Loopback-Pool"
      spanning_tree_mode: "mstp"
      dns_servers:
        - dns-google
      ntp_servers:
        - time.google.com
      local_users:
        - admin
      member_of_groups: ["fabrics"]
      children:
        kind: NetworkPod
        data:
          - name: "l2ls-pod1"
            index: 1
            device_designs:
              data:
                - role: spine
                  device_quantity: 2
                  device_template: arista-7050cx3-32c-spine-switch
            mlag_peer_pool: "Fabric-L2LS-MLAG-Peer-Pool"
            pod_ip_pools:
              - "Fabric-L2LS-MLAG-Peer-Pool"
            member_of_groups: ["pods"]

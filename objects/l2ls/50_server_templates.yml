---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateComputePhysicalServer
  parameters:
    expand_range: true
  data:
    # Dual-homed hosts land across the rack's MLAG leaf pair; single-homed hosts
    # take one access port.
    - template_name: "l2ls-host-blue-dual"
      role: "compute"
      status: "provisioning"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "L2lsHostBlueEthernet[1-2]"
            name: "Ethernet[1-2]"
            profiles: ["profile-l2ls-host-blue"]
    - template_name: "l2ls-host-green-single"
      role: "compute"
      status: "provisioning"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "L2lsHostGreenEthernet1"
            name: "Ethernet1"
            profiles: ["profile-l2ls-host-green"]
    - template_name: "l2ls-host-orange-single"
      role: "compute"
      status: "provisioning"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "L2lsHostOrangeEthernet1"
            name: "Ethernet1"
            profiles: ["profile-l2ls-host-orange"]

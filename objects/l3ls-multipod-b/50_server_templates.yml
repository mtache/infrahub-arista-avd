---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateComputePhysicalServer
  parameters:
    expand_range: true
  data:
    - template_name: "multipod-b-compute-server-single"
      role: "compute"
      status: "provisioning"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "MultiPodBComputeServerSingleEthernet1"
            name: "Ethernet1"
            profiles:
              - profile-multipod-b-compute
    - template_name: "multipod-b-compute-server-dual"
      role: "compute"
      status: "provisioning"
      interfaces:
        kind: TemplateInterfacePhysical
        parameters:
          expand_range: true
        data:
          - template_name: "MultiPodBComputeServerDualEthernet[1-2]"
            name: "Ethernet[1-2]"
            profiles:
              - profile-multipod-b-compute

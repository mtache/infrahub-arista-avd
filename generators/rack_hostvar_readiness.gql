query RackHostvarReadinessQuery($offset: Int, $limit: Int) {
  DcimDevice(offset: $offset, limit: $limit) {
    count
    edges {
      node {
        id
        name { value }
        pod { node { parent { node { __typename id } } } }
        avd_artifact { node { hostvar_file { node { id } } } }
      }
    }
  }
}
